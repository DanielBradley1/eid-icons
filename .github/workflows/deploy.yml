name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Only one deployment runs at a time; queued runs wait rather than cancel.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: msicons/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: msicons

      - name: Generate icon manifest
        run: node generate-manifest.cjs
        working-directory: msicons

      - name: Build
        # If you use a custom domain, change --base=/ below.
        # If deploying to https://<user>.github.io/eid-icons/ keep --base=/eid-icons/
        run: npm run build -- --base=/
        working-directory: msicons

      - name: Add SPA 404 fallback
        # Copies index.html → 404.html so direct URL navigation works on GitHub Pages
        run: cp msicons/dist/index.html msicons/dist/404.html

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: msicons/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
