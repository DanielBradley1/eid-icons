name: Icon Submission
description: Submit a new icon for inclusion in the MS Icons library
title: "[Icon Submission] "
labels: ["icon-submission"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for contributing! Please fill in the details below. You can either paste the SVG code directly or drag and drop the `.svg` file as an attachment in the body of this issue after submitting.

  - type: input
    id: icon-name
    attributes:
      label: Icon Name
      description: The display name of the icon as it should appear on the site.
      placeholder: e.g. Azure Blob Storage
    validations:
      required: true

  - type: dropdown
    id: category
    attributes:
      label: Category
      description: Which category best fits this icon?
      options:
        - agent-365
        - ai-machine-learning
        - analytics
        - app-services
        - azure-ecosystem
        - azure-stack
        - blockchain
        - compute
        - containers
        - databases
        - devops
        - dynamics-365
        - entra
        - fabric
        - general
        - hybrid-multicloud
        - identity
        - integration
        - intune
        - iot
        - management-governance
        - menu
        - microsoft-teams
        - migrate
        - migration
        - mixed-reality
        - mobile
        - monitor
        - networking
        - power-platform
        - security
        - server
        - sharepoint
        - storage
        - web
        - other
    validations:
      required: true

  - type: textarea
    id: svg-content
    attributes:
      label: SVG Code
      description: Paste the full SVG markup here. If you prefer, you can skip this and attach the `.svg` file directly to the issue after submitting.
      render: xml
      placeholder: |
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 18 18">
          ...
        </svg>

  - type: input
    id: source
    attributes:
      label: Source / URL
      description: Where does this icon come from? Link to official Microsoft documentation or download page if available.
      placeholder: e.g. https://learn.microsoft.com/en-us/azure/architecture/icons/

  - type: checkboxes
    id: license
    attributes:
      label: License Confirmation
      description: Please confirm the icon is from an official Microsoft source.
      options:
        - label: This icon is from an official Microsoft source and I understand it is subject to Microsoft's terms of use.
          required: true
